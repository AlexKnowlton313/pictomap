# Weekly: generate the regional ROUTING PMTiles ourselves from raw OSM and
# publish them + routing-manifest.json. Independent of the display pipeline —
# different source (Geofabrik, not Protomaps), schema (roads + ped paths only,
# one detail-preserving zoom) and manifest — but it reuses the same build
# mechanics via tiles-pipeline.yml. The app fetches both manifests at startup;
# the graph worker uses the routing one.
#
# These jobs are HEAVY: continent extracts are large (europe ~28GB) and
# tilemaker reads every node, so the build runs with a generous timeout, frees
# disk aggressively, and requests a long AWS session (continent builds outlive
# the default 1h OIDC token). If weekly proves too costly, drop to monthly —
# routing topology changes slowly.

name: Deploy routing tiles

on:
  schedule:
    # Mondays 09:00 UTC — offset from the display run (07:00) so the two heavy
    # tile jobs don't contend for the same hosted-runner pool.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      zoom:
        description: Single publish zoom (extent in config keeps z14 precision)
        default: '13'
      build_date:
        description: Version stamp YYYYMMDD (blank = today UTC)
        required: false

concurrency:
  group: deploy-routing-tiles
  cancel-in-progress: false

jobs:
  tiles:
    uses: ./.github/workflows/tiles-pipeline.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      script: tiles/build-routing.sh
      manifest_name: routing-manifest.json
      fragment_prefix: routing
      tools: osm
      min_zoom: ${{ inputs.zoom || '13' }}
      max_zoom: ${{ inputs.zoom || '13' }}
      date_offset: today
      date_override: ${{ inputs.build_date }}
      # Continent download + tilemaker can take well over an hour for the dense
      # regions; generous cap so a slow region completes.
      build_timeout: 180
      free_aggressive: true
      # Continent builds run past the default 1h OIDC session; request one that
      # outlives the 180m timeout (role MaxSessionDuration must allow it).
      role_duration: 14400
