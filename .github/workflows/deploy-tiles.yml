# Weekly: extract regional DISPLAY (basemap) PMTiles from Protomaps' daily
# planet build and publish them + manifest.json. All the build mechanics live in
# the reusable tiles-pipeline.yml; this file is just the schedule/dispatch entry
# point and the display-specific inputs.

name: Deploy tiles

on:
  schedule:
    # Mondays 07:00 UTC. Protomaps builds publish daily ~06:00 UTC, so by now
    # "yesterday's" build is reliably available.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      min_zoom:
        description: Minimum zoom level
        default: '12'
      max_zoom:
        description: Maximum zoom level
        default: '14'
      source_date:
        description: Source build date YYYYMMDD (blank = yesterday UTC)
        required: false

concurrency:
  group: deploy-tiles
  cancel-in-progress: false

jobs:
  tiles:
    uses: ./.github/workflows/tiles-pipeline.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      script: tiles/build-display.sh
      manifest_name: manifest.json
      fragment_prefix: display
      tools: pmtiles
      min_zoom: ${{ inputs.min_zoom || '12' }}
      max_zoom: ${{ inputs.max_zoom || '14' }}
      date_offset: yesterday
      date_override: ${{ inputs.source_date }}
      check_source_base: https://build.protomaps.com
      # A healthy display shard finishes in <10 min; cap at 20 so a throttled
      # shard fails fast instead of dragging on with no visible progress.
      build_timeout: 20
      download_threads: '4'
